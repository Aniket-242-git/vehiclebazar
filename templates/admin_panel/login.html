{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · {{ SITE_NAME }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg border-0" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="badge text-bg-warning rounded-circle p-3 fs-4"><i class="bi bi-shield-lock"></i></span>
        <h4 class="mt-3 mb-1 fw-bold">{{ SITE_NAME }} Admin</h4>
        <p class="text-secondary small mb-0">Staff sign-in to manage the marketplace</p>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username"
                 value="{{ request.POST.username|default:'' }}" required autofocus autocomplete="username">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
        </button>
      </form>
      <p class="text-center small text-secondary mt-4 mb-0">
        <a href="/" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to website</a>
      </p>
    </div>
  </div>
</body>
</html>
