{# Renders a Bootstrap 5 form field with label, widget, help text and errors. #}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold small mb-1">
    {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
