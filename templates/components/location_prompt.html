<!-- Location Permission Request Floating Banner -->
<div id="locationPromptBanner" class="position-fixed bottom-0 start-0 m-3 p-0 z-3 shadow-lg rounded-4 border bg-white"
     style="max-width: 380px; display: none; transition: transform 0.3s ease-in-out;">
  <div class="card border-0 rounded-4 overflow-hidden">
    <div class="card-body p-3">
      <div class="d-flex align-items-start">
        <div class="me-3 mt-1">
          <div class="rounded-circle bg-danger bg-opacity-10 d-flex align-items-center justify-content-center text-danger"
               style="width: 44px; height: 44px;">
            <i class="bi bi-geo-alt-fill fs-5"></i>
          </div>
        </div>
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="fw-bold mb-0 text-dark">Enable Location</h6>
            <button type="button" class="btn-close btn-sm" id="btnDismissLocationPrompt" aria-label="Close"></button>
          </div>
          <p class="text-secondary small mb-3 lh-sm">
            Allow location access to view vehicles and special offers near your city.
          </p>
          <div class="d-flex gap-2">
            <button type="button" id="btnAllowLocation" class="btn btn-sm btn-primary flex-grow-1 fw-semibold">
              <span id="btnAllowLocationText"><i class="bi bi-geo-alt me-1"></i>Enable Location</span>
              <span id="btnAllowLocationSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
            <button type="button" id="btnDenyLocation" class="btn btn-sm btn-outline-secondary">
              Not Now
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Location Status Toast (Feedback when allowed) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3 z-3">
  <div id="locationSuccessToast" class="toast align-items-center text-bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body small">
        <i class="bi bi-check-circle-fill me-1"></i> <span id="locationSuccessMessage">Location detected! Showing local vehicles.</span>
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
